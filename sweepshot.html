<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dhonihub – Sweep Shot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOP BAR -->
<header class="navbar">
    <div class="left">
        <span class="menu" id="menuOpen">☰</span>
    </div>

    <div class="center">
        <a href="index.html" class="logo-link">
            <span class="logo">Dhoni<span>hub</span></span>
        </a>
    </div>

    <div class="right">
            <a href="login.html" class="profile-link">
               <img src="photos/msd.jpg" class="profile-pic">
            </a>
    </div>
</header>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <span class="close" id="menuClose">✕</span>

    <a href="index.html">Home</a>
    <a href="photos.html">Photos</a>
    <a href="helicoptershot.html">Helicopter Shot</a>
    <a href="stumping.html">Stumping</a>
    <a href="pullshot.html">Pull Shot</a>
    <a href="coverdrive.html">Cover Drive</a>
    <a href="sweepshot.html">Sweep Shot</a>
</div>

<!-- OVERLAY -->
<div 
    class="sidebar-overlay" id="sidebarOverlay">
</div>

<!-- CATEGORY BAR -->
<nav class="categories">
    <a class="active" href="photos.html">Photos</a>
    <a class="active" href="helicoptershot.html">Helicopter Shot</a>
    <a class="active" href="stumping.html">Stumping</a>
    <a class="active" href="pullshot.html">Pull Shot</a>
    <a class="active" href="coverdrive.html">Cover Drive</a>
    <a class="active" href="sweepshot.html">Sweep Shot</a>
</nav>

<!-- CONTENT -->
<main class="content">
    <video src="videos/sweepshot/s1.mp4" autoplay muted loop onclick="openFullscreen(this)"></video>
    <video src="videos/sweepshot/s2.mp4" autoplay muted loop onclick="openFullscreen(this)"></video>
</main>

<script>
    function openFullscreen(el) {
        if (el.requestFullscreen) {
            el.requestFullscreen();
        } else if (el.webkitRequestFullscreen) {
            el.webkitRequestFullscreen();
        } else if (el.msRequestFullscreen) {
            el.msRequestFullscreen();
        }
    }

    const menuOpen = document.getElementById("menuOpen");
    const menuClose = document.getElementById("menuClose");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebarOverlay");

    menuOpen.onclick = () => {
        sidebar.classList.add("active");
        overlay.classList.add("active");
    };

    menuClose.onclick = () => {
        sidebar.classList.remove("active");
        overlay.classList.remove("active");
    };

    overlay.onclick = () => {
        sidebar.classList.remove("active");
        overlay.classList.remove("active");
    };
</script>

</body>
</html>
